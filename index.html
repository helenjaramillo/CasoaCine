<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Cine</title>
 
<link rel="stylesheet" href="css/style.css">
</head>
 
<body>
 
<h1>Sistema de Gestión de Cine</h1>
 
<div id="login">
 
<h2>Inicio de Sesión</h2>
 
<input type="text" id="usuario" placeholder="Usuario">
<br><br>
 
<input type="password" id="clave" placeholder="Contraseña">
<br><br>
 
<button onclick="ingresar()">Ingresar</button>
 
</div>
 
<div id="panel" style="display:none;">
 
<h2>Registro de Venta</h2>
 
<input type="text" id="pelicula" placeholder="Película">
<br><br>
 
<input type="text" id="sala" placeholder="Sala">
<br><br>
 
<input type="number" id="boletas" placeholder="Cantidad de boletas">
<br><br>
 
<input type="number" id="precio" placeholder="Precio por boleta">
<br><br>
 
<button onclick="calcular()">
Calcular Recaudación
</button>
 
<h3 id="resultado"></h3>
 
</div>
 
<script src="js/auth.js"></script>
<script src="js/calculo.js"></script>
 
</body>
</html>
