<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCali Premium</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="fondo">

    <div id="login" class="login-card">

        <div class="logo">🎬</div>

        <h1>CineCali Premium</h1>

        <p class="subtitulo">
            Sistema Inteligente de Gestión Cinematográfica
        </p>

        <div id="reloj"></div>

        <input type="text"
               id="usuario"
               placeholder="Usuario">

        <input type="password"
               id="clave"
               placeholder="Contraseña">

        <button onclick="ingresar()">
            Ingresar al Sistema
        </button>

    </div>

    <div id="panel" class="panel" style="display:none;">

        <h2>🎬 Dashboard CineCali</h2>

        <div class="dashboard">

            <div class="card">
                <h3>💰 Ingresos</h3>
                <p id="ingresos">$0</p>
            </div>

            <div class="card">
                <h3>🎟 Boletas</h3>
                <p id="totalBoletas">0</p>
            </div>

            <div class="card">
                <h3>🎞 Funciones</h3>
                <p id="funciones">0</p>
            </div>

        </div>

        <hr>

        <h2>🍿 Registro de Función</h2>

        <input type="text" id="pelicula" placeholder="Película">

        <input type="text" id="sala" placeholder="Sala">

        <input type="number" id="boletas" placeholder="Cantidad de boletas">

        <input type="number" id="precio" value="12000">

        <button onclick="registrarVenta()">
            Calcular Recaudación
        </button>

        <button onclick="cambiarAsiento()">
            Cambio de Asiento
        </button>

        <h3 id="resultado"></h3>

        <hr>

        <h2>📋 Historial</h2>

        <table>
            <thead>
                <tr>
                    <th>Película</th>
                    <th>Sala</th>
                    <th>Boletas</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody id="tablaVentas"></tbody>
        </table>

        <hr>

        <h2>📈 Recaudación</h2>

        <canvas id="grafica"></canvas>

        <hr>

        <h2>📸 Foto del Operador</h2>

        <video id="video" width="320" height="240" autoplay></video>

        <br><br>

        <button onclick="activarCamara()">
            Activar Cámara
        </button>

        <button onclick="tomarFoto()">
            Tomar Foto
        </button>

        <br><br>

        <canvas id="foto" width="320" height="240"></canvas>

    </div>

</div>

<script src="js/auth.js"></script>
<script src="js/registro.js"></script>
<script src="js/grafica.js"></script>
<script src="js/foto.js"></script>

</body>
</html>
